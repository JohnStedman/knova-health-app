<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prevent — participant app prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#061827; --navy-2:#0d2c47; --teal:#12cdb8; --teal-hi:#23e0c8; --cyan:#4bc6ff;
  --green:#2f9e6c; --amber:#c98a1f; --coral:#d9604d; --gov:#6b4cb8;
  --bg:#e9eff0; --surface:#ffffff; --surface-2:#f4f7f7; --tint:#eaf7f5; --tint-blue:#eaf4fb;
  --ink:#0a1b2b; --text:#26394a; --muted:#647686; --line:#dbe5e7;
  --green-bg:#e6f5ee; --link:#0b8576; --hero:#061827; --amber-bg:#fdf3e2; --coral-bg:#fcebe7; --gov-bg:#f0ebfa;
  --frame:#0b2843; --shadow:0 30px 80px rgba(7,30,48,.22);
  --font:"Onest",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#040e17; --surface:#0b1d2d; --surface-2:#0f2638; --tint:#0c2f33; --tint-blue:#0d2740;
    --ink:#eef5f7; --text:#cfdbe2; --muted:#8ea2b1; --line:#1d3a50;
    --green:#5cc897; --amber:#e9b04f; --coral:#f08a77; --gov:#a990e8;
    --green-bg:#10302a; --link:#23e0c8; --hero:#0f3b4c; --amber-bg:#33280f; --coral-bg:#3a1c17; --gov-bg:#221a3a;
    --frame:#000a12; --shadow:0 30px 80px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#040e17; --surface:#0b1d2d; --surface-2:#0f2638; --tint:#0c2f33; --tint-blue:#0d2740;
  --ink:#eef5f7; --text:#cfdbe2; --muted:#8ea2b1; --line:#1d3a50;
  --green:#5cc897; --amber:#e9b04f; --coral:#f08a77; --gov:#a990e8;
  --green-bg:#10302a; --link:#23e0c8; --hero:#0f3b4c; --amber-bg:#33280f; --coral-bg:#3a1c17; --gov-bg:#221a3a;
  --frame:#000a12; --shadow:0 30px 80px rgba(0,0,0,.55);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased;font-size:15px;line-height:1.5}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--cyan);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4,p{margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Review layout */
.review{display:grid;grid-template-columns:280px minmax(0,1fr) 300px;gap:32px;height:100%;padding:24px 32px;max-width:1360px;margin:0 auto}
.rail,.notes{overflow:auto;padding:4px 2px 24px}
.brand{display:flex;align-items:center;gap:12px;color:var(--ink)}
.brand svg{width:40px;height:40px;flex:none}
.brand strong{display:block;font-size:20px;letter-spacing:-.03em;font-weight:800}
.brand span{font-size:12px;color:var(--muted)}
.rail-note{margin:18px 0 22px;font-size:13px;color:var(--muted);max-width:32ch}
.stage-label{font-size:12px;font-weight:700;color:var(--muted);margin:18px 0 6px}
.screen-link{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;width:100%;text-align:left;border:0;background:transparent;padding:8px 10px;border-radius:12px;color:var(--text)}
.screen-link b{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:1px}
.screen-link strong{display:block;font-size:14px;font-weight:600;color:var(--ink)}
.screen-link:hover{background:var(--surface)}
.screen-link.active{background:var(--navy);}
.screen-link.active strong,.screen-link.active b{color:#fff}
.rail-actions{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
.ghost{border:1px solid var(--line);background:var(--surface);padding:8px 12px;border-radius:999px;font-size:13px;font-weight:600}
.stage{display:grid;place-items:center;min-height:0}
.notes h2{font-size:22px;color:var(--ink);letter-spacing:-.03em;margin-top:6px}
.notes .n-num{font-size:13px;color:var(--muted);font-weight:600}
.notes p{margin-top:10px;font-size:14px;color:var(--muted)}
.notes h3{font-size:13px;color:var(--ink);margin:22px 0 6px}
.notes ul{margin:0;padding-left:18px;font-size:14px;color:var(--text)}
.notes li{margin:4px 0}
.safeguard{margin-top:22px;padding:14px;border-radius:14px;background:var(--tint);font-size:13px;color:var(--text)}
.safeguard.gov{background:var(--gov-bg)}
.safeguard strong{display:block;color:var(--ink);margin-bottom:4px}
.pager{display:flex;gap:8px;margin-top:22px}
.pager button{flex:1}
.pager button:disabled{opacity:.4;cursor:default}

/* Phone */
.phone{position:relative;width:390px;height:min(844px,calc(100dvh - 48px));border:10px solid var(--frame);border-radius:52px;background:var(--surface-2);box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column}
.status{height:44px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 28px;font-size:14px;font-weight:700;color:var(--ink);background:var(--surface)}
.status .island{width:110px;height:30px;border-radius:20px;background:#000}
.status .icons{display:flex;gap:6px;align-items:center}
.status .icons i{display:block;width:22px;height:11px;border:2px solid currentColor;border-radius:4px;position:relative}
.status .icons i::after{content:"";position:absolute;inset:1px 4px 1px 1px;background:currentColor;border-radius:1px}
.apphead{flex:none;height:56px;display:grid;grid-template-columns:44px 1fr 44px;align-items:center;padding:0 8px;background:var(--surface);border-bottom:1px solid var(--line);position:relative;z-index:3}
.apphead strong{text-align:center;font-size:16px;color:var(--ink);font-weight:700;letter-spacing:-.02em}
.iconbtn{width:40px;height:40px;border:0;background:transparent;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.iconbtn:hover{background:var(--surface-2)}
.iconbtn svg{width:22px;height:22px}
.iconbtn[hidden]{visibility:hidden;display:grid}
.body{flex:1;overflow-y:auto;padding:18px 16px 112px;scroll-behavior:smooth}
.view-enter{animation:enter .24s ease-out}
@keyframes enter{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.tabbar{position:absolute;left:10px;right:10px;bottom:12px;z-index:4;display:grid;grid-template-columns:repeat(4,1fr);padding:8px;border-radius:24px;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px);border:1px solid var(--line);box-shadow:0 12px 30px rgba(7,30,48,.12)}
.tabbar button{border:0;background:transparent;display:grid;justify-items:center;gap:3px;padding:6px 0;border-radius:16px;font-size:11px;font-weight:600;color:var(--muted)}
.tabbar svg{width:22px;height:22px}
.tabbar button.active{color:var(--ink);background:var(--tint)}
.tabbar button.active svg{color:var(--teal)}

/* Content primitives */
.h-title{font-size:26px;line-height:1.12;letter-spacing:-.04em;color:var(--ink);font-weight:750}
.h-sub{margin-top:6px;color:var(--muted);font-size:14px}
.label{font-size:12px;font-weight:600;color:var(--muted)}
.card{margin-top:14px;padding:16px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.card h3{font-size:15px;color:var(--ink);font-weight:700;letter-spacing:-.01em}
.card p{font-size:13px;color:var(--muted);margin-top:4px}
.hero{background:var(--hero);border-color:transparent;color:#fff;position:relative;overflow:hidden}
.hero h3,.hero h4{color:#fff}
.hero h4{font-size:19px;letter-spacing:-.03em;margin-top:6px;font-weight:700;line-height:1.2}
.hero p{color:rgba(255,255,255,.7)}
.hero .label{color:var(--teal-hi)}
.hero-top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.pulse{width:84px;height:28px;flex:none;opacity:.9}
.pulse path{stroke-dasharray:240;stroke-dashoffset:240;animation:draw 1.6s .2s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:24px 2px 0}
.sec h3{font-size:16px;color:var(--ink);font-weight:700}
.link{border:0;background:none;color:var(--link);font-weight:600;font-size:13px;padding:4px}
.row{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.card>.row:first-child,.card>.marker:first-child{border-top:0;padding-top:4px}
.card>h3+.row,.card>p+.row{margin-top:8px}
.row.plain{grid-template-columns:1fr auto}
.row strong{display:block;color:var(--ink);font-size:14px;font-weight:600}
.row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--tint-blue);color:var(--ink);font-size:11px;font-weight:800}
.ic.green{background:var(--green-bg);color:var(--green)}
.ic.amber{background:var(--amber-bg);color:var(--amber)}
.ic.gov{background:var(--gov-bg);color:var(--gov)}
.ic svg{width:20px;height:20px}
.chev{color:var(--muted);font-size:18px}
.pill{display:inline-flex;align-items:center;min-height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:650;background:var(--tint-blue);color:var(--ink);white-space:nowrap}
.pill.green{background:var(--green-bg);color:var(--green)}
.pill.amber{background:var(--amber-bg);color:var(--amber)}
.pill.coral{background:var(--coral-bg);color:var(--coral)}
.pill.gov{background:var(--gov-bg);color:var(--gov)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:50px;margin-top:12px;border-radius:16px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:650;font-size:15px}
.btn.primary{background:var(--teal-hi);border-color:transparent;color:var(--navy)}
.btn.dark{background:var(--navy);border-color:transparent;color:#fff}
.btn.danger{color:var(--coral)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sm{min-height:38px;width:auto;padding:0 14px;font-size:13px;border-radius:12px;margin-top:0}
.btn-row{display:flex;gap:8px;margin-top:12px}
.btn-row .btn{margin-top:0}
.note{margin-top:14px;padding:12px 14px;border-radius:14px;background:var(--surface);border:1px dashed var(--line);font-size:12px;color:var(--muted)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kpi{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:12px;text-align:left}
.kpi b{display:block;font-size:26px;letter-spacing:-.04em;color:var(--ink);line-height:1.1}
.kpi span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
.dot.green{background:var(--green)} .dot.amber{background:var(--amber)} .dot.coral{background:var(--coral)}
.seg{display:flex;gap:6px;overflow-x:auto;margin-top:14px;padding-bottom:2px;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.active{background:var(--navy);border-color:var(--navy);color:#fff}
.progress{height:8px;border-radius:999px;background:rgba(255,255,255,.14);overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--teal-hi),var(--cyan));border-radius:inherit;transition:width .4s ease}
.check{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;color:#fff;font-size:15px;font-weight:800;padding:0}
.check.done{background:var(--green);border-color:var(--green)}
.timeline{list-style:none;margin:8px 0 0;padding:0}
.timeline li{position:relative;display:grid;grid-template-columns:30px 1fr auto;gap:12px;align-items:start;padding:12px 0}
.timeline li:not(:last-child)::before{content:"";position:absolute;left:14px;top:40px;bottom:-8px;width:2px;background:var(--line)}
.timeline .step{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:13px;font-weight:700;background:var(--surface-2);border:1px solid var(--line);color:var(--muted);position:relative;z-index:1}
.timeline .step.done{background:var(--green);border-color:var(--green);color:#fff}
.timeline .step.now{background:var(--teal-hi);border-color:var(--teal-hi);color:var(--navy)}
.timeline strong{display:block;color:var(--ink);font-size:14px}
.timeline small{color:var(--muted);font-size:12px}
.marker{display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 0;border-top:1px solid var(--line);width:100%;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0}
.marker strong{color:var(--ink);font-size:14px;display:flex;align-items:center;gap:8px}
.marker .val{font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;text-align:right}
.marker small{color:var(--muted);font-size:12px}
.range{grid-column:1/-1;height:6px;border-radius:999px;background:var(--surface-2);position:relative;margin-top:4px}
.range i{position:absolute;top:0;bottom:0;border-radius:999px;background:var(--green-bg);border:1px solid color-mix(in srgb,var(--green) 40%,transparent)}
.range b{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;border:3px solid var(--surface);transform:translateX(-50%);box-shadow:0 0 0 1px var(--line)}
.bigage{font-size:72px;font-weight:800;letter-spacing:-.06em;line-height:1;margin-top:10px;color:#fff}
.bigage span{font-size:18px;font-weight:600;letter-spacing:0;margin-left:6px;color:rgba(255,255,255,.7)}
.delta{display:inline-flex;margin-top:12px;padding:6px 12px;border-radius:999px;background:rgba(35,224,200,.16);color:var(--teal-hi);font-weight:700;font-size:13px}
.chart svg{width:100%;height:auto;display:block;margin-top:10px}
.bubble{max-width:82%;padding:10px 13px;border-radius:18px;font-size:14px;margin-top:8px}
.bubble.them{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;color:var(--text)}
.bubble.me{margin-left:auto;background:var(--navy);color:#fff;border-bottom-right-radius:6px}
.bubble small{display:block;font-size:11px;opacity:.65;margin-top:4px}
.composer{display:flex;gap:8px;margin-top:14px}
.composer input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:0 14px;height:46px}
.video{position:relative;aspect-ratio:1/1;border-radius:20px;background:radial-gradient(circle at 50% 40%,#16405f,#061827 70%);display:grid;place-items:center;color:rgba(255,255,255,.75);text-align:center;overflow:hidden;margin-top:14px}
.video .self{position:absolute;right:12px;bottom:12px;width:76px;height:100px;border-radius:14px;background:#24506f;border:2px solid rgba(255,255,255,.3);display:grid;place-items:center;font-size:11px}
.video .avatar{width:84px;height:84px;border-radius:50%;background:rgba(35,224,200,.15);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--teal-hi);margin:0 auto 10px}
.video .badge{position:absolute;left:12px;top:12px;padding:5px 10px;border-radius:999px;background:rgba(0,0,0,.4);font-size:12px;color:#fff;display:flex;gap:6px;align-items:center}
.video .badge .dot{background:var(--coral)}
.callbar{display:flex;justify-content:center;gap:12px;margin-top:12px}
.callbar button{width:54px;height:54px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.callbar button.off{background:var(--surface-2);color:var(--muted);text-decoration:line-through}
.callbar button.end{background:var(--coral);border-color:var(--coral);color:#fff}
.callbar svg{width:22px;height:22px}
.toggle{width:46px;height:28px;border-radius:999px;border:0;background:var(--line);position:relative;padding:0;flex:none}
.toggle::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle[aria-pressed="true"]{background:var(--teal)}
.toggle[aria-pressed="true"]::after{transform:translateX(18px)}
.avatar-lg{width:56px;height:56px;border-radius:18px;background:var(--teal-hi);color:var(--navy);display:grid;place-items:center;font-weight:800;font-size:20px}
.profile-top{display:flex;gap:14px;align-items:center}
.held{display:flex;gap:12px;align-items:flex-start}
.spinner{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--teal);animation:spin .8s linear infinite;flex:none}
@keyframes spin{to{transform:rotate(360deg)}}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.slots button{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 4px;font-size:13px;font-weight:600}
.slots button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.field{display:grid;gap:6px;margin-top:12px}
.field label{font-size:13px;font-weight:600;color:var(--ink)}
.field input,.field textarea,.field select{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:11px 12px;width:100%}
.field textarea{min-height:88px;resize:vertical}
.choice{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:14px;margin-top:8px;background:var(--surface);cursor:pointer}
.choice input{margin-top:3px;accent-color:var(--teal)}
.choice span{font-size:14px}
.steps{display:flex;gap:6px;margin:4px 0 14px}
.steps i{flex:1;height:4px;border-radius:999px;background:var(--line)}
.steps i.on{background:var(--teal)}
.mhr-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sumgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.sumgrid div{border:1px solid var(--line);border-radius:16px;padding:12px;background:var(--surface)}
.sumgrid b{display:block;font-size:24px;color:var(--ink);letter-spacing:-.03em}
.sumgrid span{font-size:12px;color:var(--muted)}
.empty{text-align:center;padding:18px 8px;color:var(--muted);font-size:13px}

/* Sheet */
.scrim{position:absolute;inset:0;z-index:20;background:rgba(3,17,29,.45);opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.open{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:21;max-height:86%;overflow-y:auto;background:var(--surface-2);border-radius:26px 26px 0 0;padding:10px 18px calc(24px + env(safe-area-inset-bottom,0px));visibility:hidden;transform:translateY(102%);transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s .26s}
.sheet.open{transform:none;visibility:visible;transition-delay:0s}
.sheet .grab{width:40px;height:5px;border-radius:999px;background:var(--line);margin:0 auto 12px}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.sheet-head h2{font-size:20px;color:var(--ink);letter-spacing:-.03em}
.toast{position:absolute;left:16px;right:16px;bottom:96px;z-index:30;padding:12px 14px;border-radius:14px;background:var(--navy);color:#fff;font-size:14px;font-weight:500;box-shadow:0 12px 30px rgba(0,0,0,.25);opacity:0;transform:translateY(8px);transition:.22s;pointer-events:none}
.toast.show{opacity:1;transform:none}
.doc-preview{border:1px solid var(--line);border-radius:16px;background:var(--surface);padding:16px;margin-top:12px;font-size:13px}
.doc-preview h4{color:var(--ink);font-size:15px}
.doc-preview p{color:var(--muted);margin-top:6px}

/* Responsive */
@media (max-width:1180px){.review{grid-template-columns:260px minmax(0,1fr)}.notes{display:none}}
@media (max-width:760px){
  html,body{height:100%}
  .review{display:block;padding:0;height:100%;max-width:none}
  .rail{display:none}
  .stage{height:100%;display:block}
  .phone{width:100%;height:100%;border:0;border-radius:0;box-shadow:none}
  .status{display:none}
  .tabbar{bottom:calc(8px + env(safe-area-inset-bottom,0px))}
  .body{padding-bottom:calc(112px + env(safe-area-inset-bottom,0px))}
  .toast{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div class="review">
  <aside class="rail" aria-label="Screen index">

<script>
(function(){
'use strict';

/* ---------- Screen definitions (from the wireframes) ---------- */
const STAGES=[
  {title:'Get started',screens:['home','journey','profile','documents','mhr']},
  {title:'Your appointment',screens:['bookings','consult']},
  {title:'Understand your results',screens:['results','hormones','biological','summary']},
  {title:'Act and follow up',screens:['plan','care','devices','trajectory']}
];
const ORDER=STAGES.flatMap(s=>s.screens);
const DEF={
  home:{title:'Home',name:'Home and next steps',tab:'home',summary:'A starting point that connects tasks, appointments, reviewed results and documents.',shows:['What happens next','To-do list and upcoming appointment','Reviewed health summary'],does:['Open the journey','Jump to bookings or results','Open the action plan'],safe:'Counts reflect reviewed results only; nothing unreviewed is summarised here.'},
  journey:{title:'Your journey',name:'Onboarding and timeline',tab:'home',summary:'A connected timeline makes the sequence of care visible, from history to follow-up.',shows:['History and consent','Onboarding conversation','Agreed testing scope','Results, plan and recheck'],does:['Complete the health history','Book the onboarding conversation','Open each stage'],safe:'Health history answers stay on this device in the prototype.'},
  profile:{title:'Profile',name:'Profile and preferences',tab:'profile',summary:'One menu for personal details, sharing preferences, records, wearables and support.',shows:['Identity and regular GP','Sharing and privacy controls','Notification settings'],does:['Edit details','Manage sharing','Change notifications'],safe:'Employer access to individual results is never offered as a setting.'},
  documents:{title:'Health records',name:'Documents and uploads',tab:'profile',summary:'A library for reviewed reports, the GP summary and earlier results the participant adds.',shows:['Reviewed results report','GP summary','Participant uploads with review status'],does:['Open a report','Upload prior results','Share the GP summary'],safe:'Uploads are marked “not clinically reviewed” until a clinician checks them. Files never leave the browser here.'},
  mhr:{title:'My Health Record',name:'My Health Record',tab:'profile',gov:true,summary:'National clinical information shown inside the app with overview, documents, medicines and access views.',shows:['Record summary and identity match','Pathology, imaging and discharge summaries','Medicines and allergies','Access history'],does:['Switch between four views','Filter documents','Review access history'],safe:'Illustrative only. Production use needs ADHA onboarding, conformance, healthcare identifiers, NASH PKI, role-based access and audit logging.'},
  bookings:{title:'Bookings',name:'Bookings',tab:'bookings',summary:'Upcoming appointments and rechecks with confirmation, preparation and management actions.',shows:['Next appointment and status','Pathology and consultation bookings','Preparation steps'],does:['Confirm or reschedule','Read preparation','Book the next approved service'],safe:'In production, availability and preparation come from the booking service.'},
  consult:{title:'Telehealth',name:'Telehealth consultation',tab:'bookings',summary:'Device checks, a waiting room and the in-app video consultation, with a phone fallback.',shows:['Appointment and consent','Device checks','Waiting and live states','Phone fallback'],does:['Run checks','Enter the waiting room','Mute, turn off camera, end'],safe:'No real camera, microphone or call is used. Recording is off.'},
  results:{title:'Results',name:'Result details',tab:'results',summary:'Reviewed biomarkers with values, ranges and a clinician note, without a wall of numbers.',shows:['Reviewed markers by area','Where each value sits in its range','Clinician interpretation'],does:['Filter by area','Open a marker','Read the clinician note'],safe:'Results appear only after clinical review and do not replace medical advice.'},
  hormones:{title:'Hormones & screening',name:'Hormones and screening',tab:'results',summary:'Expanded hormone results and clinician-directed screening markers, shown responsibly.',shows:['Morning cortisol','Total and free testosterone, SHBG','PSA, CEA, CA 19-9, CA 125 where indicated'],does:['Review hormone results','Read screening context','Message the care team'],safe:'Tumour markers are not general screening or a standalone diagnosis.'},
  biological:{title:'Biological age',name:'Biological age',tab:'results',summary:'A composite score compared with chronological age, with the domains behind it.',shows:['Biological age','Difference from chronological age','Metabolic, inflammation and recovery domains'],does:['Open the trajectory','Review a domain'],safe:'A composite indicator, not a diagnosis.'},
  summary:{title:'Care summary',name:'Released care summary',tab:'results',summary:'The participant sees the report and signed note only after the clinician releases them.',shows:['Held state before release','Released report','Signed consultation note'],does:['Review released content','Return to the consultation'],safe:'Draft AI notes and unreleased reports are never shown to the participant.'},
  plan:{title:'My plan',name:'Personal action plan',tab:'home',summary:'Priorities and progress, linked to reviewed results and the care team.',shows:['Four clinician-approved actions','Completion progress','Reflections'],does:['Mark an action complete','Add a reflection','Book a recheck'],safe:'Actions come from the reviewing clinician, not automated rules.'},
  care:{title:'Care team',name:'Care-team conversation',tab:'profile',summary:'Questions and coordination with the care team in one thread.',shows:['Care-team messages','Reply composer','Follow-up booking'],does:['Send a message','Book a review'],safe:'Not for urgent concerns; the thread directs people to 000 or their GP.'},
  devices:{title:'Connected devices',name:'Connected devices',tab:'profile',summary:'Wearable data adds sleep, recovery and activity context between assessments.',shows:['WHOOP, Apple Watch, Health Connect, Oura','Sync status','Permissions'],does:['Connect or disconnect','Sync now'],safe:'Wearable data supports trends and coaching; it is not diagnostic evidence.'},
  trajectory:{title:'Age trajectory',name:'Age trajectory',tab:'results',summary:'Repeat results shown as a trend so people can see direction of travel.',shows:['Biological age over time','Improvement summary','Key drivers'],does:['Change timeframe','Review drivers'],safe:'Language focuses on repeatable change, never guaranteed outcomes.'}
};

/* ---------- Data ---------- */
const MARKERS=[
  {id:'hba1c',name:'HbA1c',area:'Metabolic',val:5.7,unit:'%',lo:4.0,hi:5.6,min:3.5,max:7,status:'monitor',ref:'4.0–5.6',why:'Average blood glucose over about three months.',next:'Up from 5.5% last year. Repeat in 3 months alongside the movement goal in your plan.'},
  {id:'glucose',name:'Fasting glucose',area:'Metabolic',val:5.1,unit:'mmol/L',lo:3.6,hi:6.0,min:3,max:8,status:'ok',ref:'3.6–6.0',why:'Blood sugar after an overnight fast.',next:'No action needed.'},
  {id:'insulin',name:'Fasting insulin',area:'Metabolic',val:9,unit:'mU/L',lo:2,hi:12,min:0,max:25,status:'ok',ref:'2–12',why:'How much insulin your body needs to manage glucose.',next:'No action needed.'},
  {id:'alt',name:'ALT',area:'Metabolic',val:38,unit:'U/L',lo:5,hi:35,min:0,max:70,status:'monitor',ref:'5–35',why:'A liver enzyme that can rise with metabolic strain.',next:'Slightly high. Recheck with HbA1c; reduce alcohol where possible.'},
  {id:'apob',name:'ApoB',area:'Heart',val:0.73,unit:'g/L',lo:0,hi:0.9,min:0,max:1.6,status:'ok',ref:'<0.90',why:'Counts the particles that carry cholesterol into artery walls.',next:'Maintain your current activity and nutrition pattern.'},
  {id:'ldl',name:'LDL cholesterol',area:'Heart',val:2.4,unit:'mmol/L',lo:0,hi:3.0,min:0,max:5,status:'ok',ref:'<3.0',why:'Cholesterol carried by LDL particles.',next:'No action needed.'},
  {id:'tg',name:'Triglycerides',area:'Heart',val:1.1,unit:'mmol/L',lo:0,hi:2.0,min:0,max:3.5,status:'ok',ref:'<2.0',why:'Fats in the blood, sensitive to diet and alcohol.',next:'No action needed.'},
  {id:'crp',name:'hs-CRP',area:'Inflammation',val:0.6,unit:'mg/L',lo:0,hi:1.0,min:0,max:4,status:'ok',ref:'<1.0',why:'A sensitive marker of low-grade inflammation.',next:'Low. No action needed.'},
  {id:'vitd',name:'Vitamin D',area:'Nutrition',val:82,unit:'nmol/L',lo:50,hi:150,min:0,max:200,status:'ok',ref:'50–150',why:'Supports bone, muscle and immune health.',next:'No action needed.'},
  {id:'ferritin',name:'Ferritin',area:'Nutrition',val:68,unit:'µg/L',lo:30,hi:300,min:0,max:400,status:'ok',ref:'30–300',why:'Your body’s iron stores.',next:'Review only if symptoms change.'},
  {id:'omega',name:'Omega-3 index',area:'Nutrition',val:8.2,unit:'%',lo:6,hi:12,min:0,max:14,status:'ok',ref:'>6.0',why:'Omega-3 fats in red blood cell membranes.',next:'No action needed.'},
  {id:'sleep',name:'Sleep score',area:'Recovery',val:58,unit:'/ 100',lo:70,hi:100,min:0,max:100,status:'action',ref:'Questionnaire',why:'From your sleep questionnaire and wearable trend.',next:'Start the 14-day sleep reset and review in 4 weeks.'}
];
const STATUS={ok:['In range','green'],monitor:['Monitor','amber'],action:['Action','coral']};
const PLAN=[
  {id:'sleep',title:'Complete the 14-day sleep reset',area:'Sleep & recovery',detail:'Keep a consistent sleep window of 7.5 hours in bed on at least five nights each week. Screens off 45 minutes before bed.'},
  {id:'movement',title:'Add two resistance sessions a week',area:'Metabolic health',detail:'Supports insulin sensitivity. Any format counts: gym, bands or bodyweight, 30 minutes each.'},
  {id:'retest',title:'Book your 3-month recheck',area:'Care coordination',detail:'Repeat HbA1c and ALT, then review progress with your clinician.'},
  {id:'gp',title:'Share your GP summary',area:'Continuity of care',detail:'Send the reviewed summary to your regular doctor so your care stays connected.'}
];
const SLOTS=['Mon 9 Nov','Tue 10 Nov','Wed 11 Nov','Thu 12 Nov','Fri 13 Nov','Mon 16 Nov'];
const TIMES=['8:00 am','9:30 am','11:00 am','1:30 pm','3:00 pm','4:30 pm'];

function defaults(){return{
  name:'Alex Smith',email:'alex.smith@example.com',gp:'Dr Hannah Lee, Norwood Family Practice',
  intake:{done:false,goals:[],history:'',meds:'',consent:false},
  onboarding:false,
  planDone:{sleep:true,movement:false,retest:false,gp:false},
  reflections:[],
  uploads:[],
  appts:[
    {id:'review',title:'Results review',kind:'Telehealth',when:'Fri 13 Nov · 10:30 am',where:'Video in the Prevent app',status:'action',prep:['Run your device checks','Find a quiet, private space','Have your questions ready']},
    {id:'lab',title:'3-month metabolic recheck',kind:'Pathology',when:'Fri 6 Nov · 8:00 am',where:'Partner collection centre, Adelaide CBD',status:'confirmed',prep:['Fast for 10 hours (water is fine)','Bring your request form or app QR','Allow 15 minutes']}
  ],
  messages:[
    {me:false,text:'Hi Alex, your Prevent Plus results have been reviewed. Start with the sleep reset in your plan, and bring any questions to your results review.',who:'Sam, nurse reviewer',t:'Mon 9:12 am'}
  ],
  devices:{whoop:true,apple:true,android:false,oura:true},
  synced:'Today, 7:02 am',
  notif:{appts:true,results:true,plan:false},
  sharing:{gp:true,research:false},
  checks:{camera:false,mic:false,network:false,space:false},
  consultId:'review', call:'idle', mic:true, cam:true, fallback:false,
  released:false,
  range:'1y', resultsArea:'All', mhrTab:'overview', mhrFilter:'All'
};}

const KEY='prevent-app-proto-v1';
let S;
try{S=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){S=null}
S=Object.assign(defaults(),S||{});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

/* ---------- Helpers ---------- */
const $=s=>document.querySelector(s);
const esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const first=()=>S.name.split(' ')[0]||'there';
const initials=()=>S.name.split(' ').filter(Boolean).map(x=>x[0]).join('').slice(0,2).toUpperCase();
const consultAppointment=()=>S.appts.find(a=>a.id===S.consultId&&a.kind==='Telehealth');
const I={
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11l8-6 8 6v8a1 1 0 0 1-1 1h-4v-6H9v6H5a1 1 0 0 1-1-1z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="15" rx="3"/><path d="M8 3v4M16 3v4M4 10h16"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 13h4l2-5 4 10 2-5h6"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  mic:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>',
  cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="3" y="6" width="13" height="12" rx="3"/><path d="M16 10l5-3v10l-5-3z"/></svg>',
  end:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 14c4-4 12-4 16 0l-2 2-3-1v-2a10 10 0 0 0-6 0v2l-3 1z"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M7 3h7l5 5v13H7z"/><path d="M14 3v5h5"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  watch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6l1-3h4l1 3M9 18l1 3h4l1-3"/></svg>',
  shield:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.4 8-8 9-4.6-1-8-4.5-8-9V6z"/></svg>',
  bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l2 2H4z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"/></svg>'
};
const row=(icon,title,sub,attrs,end,cls='')=>`<button class="row" ${attrs}><span class="ic ${cls}">${icon}</span><span><strong>${title}</strong><small>${sub}</small></span>${end||'<span class="chev">›</span>'}</button>`;
const go=id=>`data-go="${id}"`;

/* ---------- Screens ---------- */
const V={};
V.home=()=>{
  const counts={ok:0,monitor:0,action:0};MARKERS.forEach(m=>counts[m.status]++);
  const done=PLAN.filter(p=>S.planDone[p.id]).length;
  const upcoming=S.appts.filter(a=>a.status!=='cancelled');
  const todo=[];
  if(!S.intake.done)todo.push(row(I.doc,'Complete your health history','Goals, consent and clinical context',`data-act="intake"`));
  if(!S.uploads.length)todo.push(row(I.doc,'Add previous results','Helps your clinician see the full picture',go('documents')));
  const pend=S.appts.find(a=>a.status==='action');if(pend)todo.push(row(I.cal,'Confirm '+esc(pend.title.toLowerCase()),esc(pend.kind)+' · '+esc(pend.when.split(' · ')[0]),go('bookings'),'<span class="pill amber">To do</span>','amber'));
  return `<h1 class="h-title">Welcome back, ${esc(first())}.</h1><p class="h-sub">A clearer picture. A practical next step.</p>
  <div class="card hero"><div class="hero-top"><span class="label">Your next step</span><svg class="pulse" viewBox="0 0 84 28" aria-hidden="true"><path d="M2 16h18l5-11 9 20 6-11h42" fill="none" stroke="#23e0c8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h4>${S.released?'Your care summary is ready.':S.intake.done?'Prepare for your results review.':'Prepare for your clinician conversation.'}</h4>
    <p>${S.released?'Your clinician has signed and released notes from your consultation.':'Complete your history, add prior results and bring your questions.'}</p>
    <button class="btn primary" ${go(S.released?'summary':'journey')}>${S.released?'Open care summary':'See your journey'}</button></div>
  <div class="sec"><h3>To do</h3><span class="label">${todo.length} left</span></div>
  <div class="card">${todo.length?todo.join(''):'<p class="empty">You’re all caught up.</p>'}</div>
  <div class="sec"><h3>Upcoming care</h3><button class="link" ${go('bookings')}>All bookings</button></div>
  <div class="card">${upcoming.length?upcoming.slice(0,2).map(a=>row(a.kind==='Telehealth'?I.cam:I.cal,esc(a.title),esc(a.when),a.kind==='Telehealth'?`data-act="consult" data-id="${a.id}"`:go('bookings'),pillFor(a.status),a.status==='action'?'amber':'')).join(''):'<p class="empty">No upcoming appointments.</p><button class="btn" data-act="book">Book an appointment</button>'}</div>
  <div class="sec"><h3>Your health summary</h3><button class="link" ${go('results')}>All results</button></div>
  <div class="kpis">
    <button class="kpi" data-act="area" data-id="Recovery"><b>${counts.action}</b><span><i class="dot coral"></i>Action</span></button>
    <button class="kpi" data-act="area" data-id="Monitor"><b>${counts.monitor}</b><span><i class="dot amber"></i>Monitor</span></button>
    <button class="kpi" data-act="area" data-id="All"><b>${counts.ok}</b><span><i class="dot green"></i>In range</span></button>
  </div>
  <button class="card row plain" ${go('plan')} style="margin-top:14px;padding:16px"><span><strong>Your action plan</strong><small>${done} of ${PLAN.length} actions complete</small></span><span class="chev">›</span></button>`;
};
function pillFor(s){return s==='confirmed'?'<span class="pill green">Confirmed</span>':s==='action'?'<span class="pill amber">Confirm</span>':s==='cancelled'?'<span class="pill coral">Cancelled</span>':'<span class="pill">Upcoming</span>'}

V.journey=()=>{
  const steps=[
    {t:'Your history',s:'Questionnaire, previous records and consent',done:S.intake.done,act:'data-act="intake"',btn:S.intake.done?'Edit':'Start'},
    {t:'Meet your clinician',s:'A 20-minute onboarding conversation',done:S.onboarding,act:'data-act="onboarding"',btn:S.onboarding?'Booked':'Book'},
    {t:'Complete agreed tests',s:'Scope, preparation and appointments',done:false,act:go('bookings'),btn:'Open'},
    {t:'Review results',s:'Sources, context and next steps',done:S.released,act:go('results'),btn:'Open'},
    {t:'Act and follow up',s:'Personal plan and repeat review',done:false,act:go('plan'),btn:'Open'}
  ];
  const nowIdx=steps.findIndex(s=>!s.done);
  return `<h1 class="h-title">Know what happens next.</h1><p class="h-sub">A connected pathway from your story to your follow-up.</p>
  <div class="card"><h3>Your care timeline</h3><ol class="timeline">${steps.map((s,i)=>`<li><span class="step ${s.done?'done':i===nowIdx?'now':''}">${s.done?'✓':i+1}</span><span><strong>${s.t}</strong><small>${s.s}</small></span><button class="btn sm" ${s.act}>${s.btn}</button></li>`).join('')}</ol></div>
  <div class="note">Typical timing: history 10 minutes, onboarding within a week, results reviewed 5–7 business days after collection.</div>`;
};

V.profile=()=>`<div class="card"><div class="profile-top"><div class="avatar-lg">${esc(initials())}</div><div><h3>${esc(S.name)}</h3><p>Prevent Plus member</p></div></div><button class="btn" data-act="edit-profile">Edit personal details</button></div>
  <div class="sec"><h3>Records and devices</h3></div>
  <div class="card">${row(I.doc,'Documents','Reports and earlier results',go('documents'))}${row(I.shield,'My Health Record','Documents, medicines and access',go('mhr'),'','gov')}${row(I.watch,'Connected devices',Object.values(S.devices).filter(Boolean).length+' connected',go('devices'),'','green')}</div>
  <div class="sec"><h3>Support and settings</h3></div>
  <div class="card">${row(I.chat,'Care team','Ask a question or book a review',go('care'))}${row(I.shield,'Sharing and privacy',S.sharing.gp?'GP summary sharing on':'GP summary sharing off','data-act="sharing"')}${row(I.bell,'Notifications',Object.values(S.notif).filter(Boolean).length+' of 3 on','data-act="notifications"')}</div>
  <div class="note">Regular GP: ${esc(S.gp)}. Fictional participant for prototype review.</div>`;

V.documents=()=>`<h1 class="h-title">Your document library.</h1><p class="h-sub">Reviewed reports and earlier results, ready for your care conversation.</p>
  <div class="card"><h3>Reviewed by your clinician</h3>${row(I.doc,'Prevent results report','Reviewed 18 Jul · 6 pages','data-act="doc" data-id="report"','<span class="pill green">Reviewed</span>','green')}${row(I.doc,'GP summary','Ready to share with your doctor','data-act="doc" data-id="gp"',S.planDone.gp?'<span class="pill green">Shared</span>':'<span class="chev">›</span>','green')}</div>
  <div class="card"><h3>Your uploads</h3>${S.uploads.length?S.uploads.map(u=>row(I.doc,esc(u.name),esc(u.size)+' · added '+esc(u.date),'data-act="upload-view" data-id="'+u.id+'"','<span class="pill amber">Not reviewed</span>','amber')).join(''):'<p class="empty">No earlier results added yet. Previous blood tests or GP letters help your clinician compare trends.</p>'}
  <label class="btn primary" style="cursor:pointer">Upload previous results<input type="file" id="fileInput" multiple accept=".pdf,.jpg,.jpeg,.png,.heic" hidden></label></div>
  <button class="btn" ${go('mhr')}>Open My Health Record</button>
  <div class="note">In this prototype, files stay in your browser and only the file name is kept.</div>`;

V.mhr=()=>{
  const docs=[['LAB','Pathology report','Full blood count · 24 Jul 2026','Pathology'],['LAB','Pathology report','Lipid studies · 24 Jul 2026','Pathology'],['IMG','Diagnostic imaging report','Chest X-ray · 12 May 2026','Imaging'],['SHS','Shared health summary','Uploaded by GP · 15 Jan 2026','Summaries'],['DC','Discharge summary','Hospital admission · 4 Feb 2026','Summaries']];
  const tab=S.mhrTab;

function markerRow(m){
  const [lab,col]=STATUS[m.status];const span=m.max-m.min;
  const pos=Math.max(2,Math.min(98,(m.val-m.min)/span*100));
  const lo=(m.lo-m.min)/span*100,hi=(Math.min(m.hi,m.max)-m.min)/span*100;
  const colVar=col==='green'?'var(--green)':col==='amber'?'var(--amber)':'var(--coral)';
  return `<button class="marker" data-act="marker" data-id="${m.id}"><strong><i class="dot ${col}"></i>${m.name}</strong><span class="val">${m.val} <small>${m.unit}</small></span><small>${m.area} · ${lab}</small><small style="text-align:right">Ref ${m.ref}</small><span class="range" aria-hidden="true"><i style="left:${lo}%;width:${hi-lo}%"></i><b style="left:${pos}%;background:${colVar}"></b></span></button>`;
}

V.trajectory=()=>{

  const d=sets[S.range];const W=300,H=170,px=30,py=22;
  const vals=d.map(x=>x[1]);const mn=Math.min(...vals)-1,mx=Math.max(...vals)+1;

    <line x1="${px}" y1="${H-py+8}" x2="${W-6}" y2="${H-py+8}" stroke="var(--line)"/>
    <polyline points="${pts.map(p=>p.join(',')).join(' ')}" fill="none" stroke="var(--teal)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?6:4.5}" fill="${i===pts.length-1?'var(--teal)':'var(--surface)'}" stroke="var(--teal)" stroke-width="2.5"/><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="11" font-weight="700" fill="var(--ink)" font-family="Onest,sans-serif">${d[i][1]}</text><text x="${p[0]}" y="${H+12}" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="Onest,sans-serif">${d[i][0]}</text>`).join('')}

};

/* ---------- Navigation ---------- */
let stack=['home'];
const cur=()=>stack[stack.length-1];
function nav(id,{replace=false,root=false}={}){
  if(!DEF[id])return;
  if(root)stack=[id];else if(replace)stack[stack.length-1]=id;else if(cur()!==id)stack.push(id);
  closeSheet(true);render(true);
}
function render(animate){
  const id=cur(),d=DEF[id];
  $('#title').textContent=d.title;
  $('#backBtn').hidden=stack.length<2;
  const body=$('#body');
  body.innerHTML=`<div class="${animate?'view-enter':''}">${V[id]()}</div>`;
  if(animate)body.scrollTop=0;
  $('#tabbar').innerHTML=[['home','Home',I.home],['bookings','Bookings',I.cal],['results','Results',I.pulse],['profile','Profile',I.user]].map(([t,l,ic])=>`<button class="${d.tab===t?'active':''}" aria-current="${d.tab===t?'page':'false'}" data-tab="${t}">${ic}<span>${l}</span></button>`).join('');
  renderIndex();renderNotes();bindScreen();
}
function renderIndex(){
  $('#index').innerHTML=STAGES.map(s=>`<div class="stage-label">${s.title}</div>`+s.screens.map(id=>`<button class="screen-link ${cur()===id?'active':''}" data-root="${id}"><b>${String(ORDER.indexOf(id)+1).padStart(2,'0')}</b><span><strong>${DEF[id].name}</strong></span></button>`).join('')).join('');
}
function renderNotes(){
  const id=cur(),d=DEF[id],i=ORDER.indexOf(id);
  $('#notes').innerHTML=`<span class="n-num">Screen ${i+1} of ${ORDER.length} · ${STAGES.find(s=>s.screens.includes(id)).title}</span><h2>${d.name}</h2><p>${d.summary}</p>
  <h3>What it shows</h3><ul>${d.shows.map(x=>`<li>${x}</li>`).join('')}</ul><h3>What you can do</h3><ul>${d.does.map(x=>`<li>${x}</li>`).join('')}</ul>
  <div class="safeguard ${d.gov?'gov':''}"><strong>Clinical and data safeguard</strong>${d.safe}</div>
  <div class="pager"><button class="ghost" data-root="${ORDER[i-1]||''}" ${i<=0?'disabled':''}>Previous screen</button><button class="ghost" data-root="${ORDER[i+1]||''}" ${i>=ORDER.length-1?'disabled':''}>Next screen</button></div>`;
}
function bindScreen(){
  const f=$('#fileInput');
  if(f)f.addEventListener('change',()=>{
    const today=new Date().toLocaleDateString('en-AU',{day:'numeric',month:'short'});
    [...f.files].forEach(file=>S.uploads.push({id:'u'+Date.now()+Math.random().toString(36).slice(2,6),name:file.name,size:file.size>1e6?(file.size/1e6).toFixed(1)+' MB':Math.max(1,Math.round(file.size/1e3))+' KB',date:today}));
    save();render();toast(f.files.length>1?f.files.length+' files added':'File added');
  });
  const c=$('#composer');
  if(c)c.addEventListener('submit',e=>{e.preventDefault();const v=$('#msg').value.trim();if(!v)return;
    S.messages.push({me:true,text:v,t:'Just now'});save();render();
    const b=$('#body');b.scrollTop=b.scrollHeight;
    setTimeout(()=>{S.messages.push({me:false,text:'Thanks '+first()+', got it. A nurse reviewer will reply within one business day. If it can’t wait, call your GP.',who:'Prevent care team',t:'Just now'});save();if(cur()==='care'){render();const bb=$('#body');bb.scrollTop=bb.scrollHeight}},1400);
  });
}

/* ---------- Sheet + toast ---------- */
let sheetTrigger=null,sheetFocusTimer;
function setSheetBackgroundInert(value){
  document.querySelectorAll('.rail,.notes,.apphead,#body,#tabbar').forEach(el=>{el.inert=value});
}
function openSheet(title,html,bind){
  const sheet=$('#sheet');
  if(!sheet.classList.contains('open'))sheetTrigger=document.activeElement;
  $('#sheetContent').innerHTML=`<div class="sheet-head"><h2 id="sheetTitle">${esc(title)}</h2><button class="iconbtn" data-act="close-sheet" aria-label="Close">✕</button></div>${html}`;
  sheet.inert=false;sheet.setAttribute('aria-hidden','false');sheet.setAttribute('aria-modal','true');
  $('#scrim').classList.add('open');sheet.classList.add('open');
  sheet.focus({preventScroll:true});setSheetBackgroundInert(true);
  if(bind)bind($('#sheetContent'));
  clearTimeout(sheetFocusTimer);
  sheetFocusTimer=setTimeout(()=>{const f=$('#sheetContent').querySelector('input,textarea,button:not([data-act="close-sheet"])');if(sheet.classList.contains('open'))f&&f.focus({preventScroll:true})},260);
}
function closeSheet(){
  const sheet=$('#sheet');
  clearTimeout(sheetFocusTimer);
  if(!sheet.classList.contains('open'))return;
  setSheetBackgroundInert(false);
  const target=sheetTrigger&&sheetTrigger.isConnected?sheetTrigger:document.querySelector('[data-act="screens"]');
  target.focus({preventScroll:true});
  $('#scrim').classList.remove('open');sheet.classList.remove('open');
  sheet.inert=true;sheet.setAttribute('aria-hidden','true');sheet.setAttribute('aria-modal','false');
  sheetTrigger=null;
}
let tt;function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),2200);}

/* ---------- Flows ---------- */
function intakeFlow(step=0){
  const goals=['Understand my risk','More energy','Sleep better','Weight and metabolism','Heart health','Healthy ageing'];
  const n=4;const bar=`<div class="steps">${Array.from({length:n},(_,i)=>`<i class="${i<=step?'on':''}"></i>`).join('')}</div>`;
  const pages=[
    ()=>`${bar}<p class="h-sub" style="margin:0">What would you like Prevent to help with? Choose any.</p>${goals.map(g=>`<label class="choice"><input type="checkbox" name="g" value="${g}" ${S.intake.goals.includes(g)?'checked':''}><span>${g}</span></label>`).join('')}`,
    ()=>`${bar}<div class="field"><label for="hist">Health history</label><textarea id="hist" placeholder="Past conditions, surgeries, family history">${esc(S.intake.history)}</textarea></div>`,
    ()=>`${bar}<div class="field"><label for="meds">Current medicines and supplements</label><textarea id="meds" placeholder="Name, dose and how often">${esc(S.intake.meds)}</textarea></div>`,
    ()=>`${bar}<p class="h-sub" style="margin:0">Prevent is a preventive health service. A clinician reviews your results before you see them, and your information is shared only as you choose.</p><label class="choice"><input type="checkbox" id="consent" ${S.intake.consent?'checked':''}><span>I consent to Prevent collecting and using my health information to provide this service.</span></label><p id="err" class="label" style="color:var(--coral);margin-top:8px" hidden>Tick consent to finish.</p>`
  ];
  openSheet(['Your goals','Health history','Medicines','Consent'][step],pages[step]()+`<div class="btn-row" style="margin-top:16px">${step?'<button class="btn" data-f="back">Back</button>':''}<button class="btn primary" data-f="next">${step===n-1?'Finish':'Continue'}</button></div>`,el=>{
    const store=()=>{
      if(step===0)S.intake.goals=[...el.querySelectorAll('input[name=g]:checked')].map(x=>x.value);
      if(step===1)S.intake.history=el.querySelector('#hist').value;
      if(step===2)S.intake.meds=el.querySelector('#meds').value;
      if(step===3)S.intake.consent=el.querySelector('#consent').checked;
      save();
    };
    el.querySelector('[data-f=next]').onclick=()=>{store();
      if(step<n-1)return intakeFlow(step+1);
      if(!S.intake.consent){el.querySelector('#err').hidden=false;return}
      S.intake.done=true;save();closeSheet();render();toast('Health history saved');
    };
    const b=el.querySelector('[data-f=back]');if(b)b.onclick=()=>{store();intakeFlow(step-1)};
  });
}
function slotPicker(title,cta,onDone,services){
  let day=null,time=null,svc=services?services[0]:null;
  const draw=()=>`${services?`<div class="field"><label for="svc">Service</label><select id="svc">${services.map(s=>`<option ${s===svc?'selected':''}>${s}</option>`).join('')}</select></div>`:''}
    <p class="label" style="margin-top:14px">Day</p><div class="slots">${SLOTS.map(s=>`<button data-day="${s}" class="${s===day?'active':''}">${s}</button>`).join('')}</div>
    <p class="label" style="margin-top:14px">Time (Adelaide)</p><div class="slots">${TIMES.map(s=>`<button data-time="${s}" class="${s===time?'active':''}">${s}</button>`).join('')}</div>
    <button class="btn primary" data-f="ok" ${day&&time?'':'disabled'} style="margin-top:16px">${cta}</button>`;
  const bind=el=>{
    el.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{day=b.dataset.day;redraw()});
    el.querySelectorAll('[data-time]').forEach(b=>b.onclick=()=>{time=b.dataset.time;redraw()});
    const s=el.querySelector('#svc');if(s)s.onchange=()=>{svc=s.value};
    el.querySelector('[data-f=ok]').onclick=()=>{closeSheet();onDone(day+' · '+time,svc)};
  };
  const redraw=()=>{const host=$('#sheetContent');const sc=$('#sheet').scrollTop;host.querySelector('.slot-host').innerHTML=draw();bind(host);$('#sheet').scrollTop=sc};
  openSheet(title,`<div class="slot-host">${draw()}</div>`,bind);
}

/* ---------- Actions ---------- */
const A={
  screens(){openSheet('All screens',STAGES.map(s=>`<p class="label" style="margin-top:14px">${s.title}</p><div class="card" style="margin-top:6px;padding:4px 14px">${s.screens.map(id=>`<button class="row plain" data-root="${id}"><span><strong>${String(ORDER.indexOf(id)+1).padStart(2,'0')}  ${DEF[id].name}</strong></span><span class="chev">›</span></button>`).join('')}</div>`).join('')+`<div class="btn-row"><button class="btn" data-act="theme">Light / dark</button><button class="btn danger" data-act="reset-demo">Reset demo</button></div>`)},
  'close-sheet'(){closeSheet()},
  intake(){intakeFlow(0)},
  onboarding(){if(S.onboarding){toast('Onboarding call already booked');return}slotPicker('Meet your clinician','Book onboarding call',when=>{S.onboarding=true;S.appts.push({id:'onb'+Date.now(),title:'Onboarding conversation',kind:'Telehealth',when,where:'Video in the Prevent app',status:'confirmed',prep:['Have your goals in mind','Find a quiet space']});save();render();toast('Onboarding call booked for '+when)})},
  area(id){S.resultsArea=id;save();if(cur()!=='results')nav('results');else render()},
  marker(id){const m=MARKERS.find(x=>x.id===id);const [lab,col]=STATUS[m.status];
    openSheet(m.name,`<span class="pill ${col}">${lab}</span><div class="bigage" style="color:var(--ink);font-size:48px">${m.val}<span style="color:var(--muted)">${m.unit}</span></div><p class="label" style="margin-top:4px">Reference range ${m.ref}</p>
    <div class="card"><h3>What it measures</h3><p>${m.why}</p></div><div class="card"><h3>Reviewed next step</h3><p>${m.next}</p></div>
    ${m.status!=='ok'?`<button class="btn primary" data-act="sheet-go" data-id="plan">See it in your plan</button>`:''}<button class="btn" data-act="sheet-go" data-id="care">Ask about this result</button>`)},
  'sheet-go'(id){nav(id)},
  confirm(id){const a=S.appts.find(x=>x.id===id);a.status='confirmed';save();render();toast(a.title+' confirmed')},
  prep(id){const a=S.appts.find(x=>x.id===id);openSheet('Prepare for '+a.title.toLowerCase(),`<p class="h-sub" style="margin:0">${esc(a.when)} · ${esc(a.where)}</p><div class="card">${a.prep.map((p,i)=>`<label class="choice" style="border:0;padding:8px 0;margin:0"><input type="checkbox"><span>${p}</span></label>`).join('')}</div>${a.kind==='Telehealth'?`<button class="btn primary" data-act="consult" data-id="${a.id}">Run device checks</button>`:''}`)},
  reschedule(id){const a=S.appts.find(x=>x.id===id);slotPicker('Change '+a.title.toLowerCase(),'Confirm new time',when=>{a.when=when;a.status='confirmed';save();render();toast('Moved to '+when)});
    setTimeout(()=>{const h=$('#sheetContent');h.insertAdjacentHTML('beforeend',`<button class="btn danger" data-act="cancel-appt" data-id="${id}">Cancel this appointment</button>`)},0)},
  'cancel-appt'(id){const a=S.appts.find(x=>x.id===id);a.status='cancelled';if(id===S.consultId)S.call='idle';save();closeSheet();render();toast(a.title+' cancelled')},
  rebook(id){A.reschedule(id)},
  book(kind){const services=['3-month metabolic recheck (pathology)','Results review (telehealth)','Health coaching session (telehealth)'];
    if(kind==='recheck')services.unshift(services.splice(0,1)[0]);if(kind==='review')services.unshift(services.splice(1,1)[0]);
    slotPicker('Book an appointment','Book appointment',(when,svc)=>{const tele=/telehealth/.test(svc);S.appts.push({id:'n'+Date.now(),title:svc.replace(/ \(.*\)/,''),kind:tele?'Telehealth':'Pathology',when,where:tele?'Video in the Prevent app':'Partner collection centre, Adelaide CBD',status:'confirmed',prep:tele?['Run your device checks','Find a quiet space']:['Fast for 10 hours','Bring your request form']});
      if(/recheck/.test(svc)){S.planDone.retest=true}save();if(cur()!=='bookings')nav('bookings');else render();toast('Booked: '+when)},services)},
  consult(id){
    const a=S.appts.find(x=>x.id===id&&x.kind==='Telehealth'&&x.status!=='cancelled');
    if(!a){nav('bookings');return}
    if(S.consultId!==id){Object.assign(S,{consultId:id,call:'idle',checks:{camera:false,mic:false,network:false,space:false},mic:true,cam:true,fallback:false});save()}
    nav('consult');
  },
  check(id){S.checks[id]=!S.checks[id];S.call='checks';save();render()},
  join(){S.call='waiting';save();render();setTimeout(()=>{if(S.call==='waiting'){S.call='live';save();if(cur()==='consult')render();toast('Dr Shah has joined')}},2600)},
  leave(){S.call='checks';save();render()},
  mic(){S.mic=!S.mic;save();render()},cam(){S.cam=!S.cam;save();render()},
  fallback(){S.fallback=true;save();render();toast('Your clinician will call your mobile')},
  end(){S.call='ended';const a=consultAppointment();if(a)a.status='confirmed';save();render()},
  rejoin(){Object.assign(S,{call:'idle',checks:{camera:false,mic:false,network:false,space:false},fallback:false,released:false});save();render()},
  release(){S.released=true;S.messages.push({me:false,text:'Your care summary from today’s consultation has been signed and released.',who:'Dr Priya Shah',t:'Just now'});save();render();toast('Care summary released')},
  'plan-toggle'(id){S.planDone[id]=!S.planDone[id];save();render();const d=PLAN.filter(p=>S.planDone[p.id]).length;toast(S.planDone[id]?(d===PLAN.length?'All actions complete':'Marked complete'):'Reopened')},
  'plan-detail'(id){const p=PLAN.find(x=>x.id===id);openSheet(p.title,`<span class="pill">${p.area}</span><div class="card"><p style="color:var(--text);font-size:14px">${p.detail}</p></div><button class="btn primary" data-act="plan-toggle-close" data-id="${id}">${S.planDone[id]?'Mark as not done':'Mark complete'}</button>${id==='retest'?'<button class="btn" data-act="book" data-id="recheck">Book the recheck</button>':''}${id==='gp'?'<button class="btn" data-act="doc" data-id="gp">Open GP summary</button>':''}`)},
  'plan-toggle-close'(id){closeSheet();A['plan-toggle'](id)},
  reflect(){openSheet('Add a reflection',`<div class="field"><label for="ref">How are you going with your plan?</label><textarea id="ref" placeholder="For example: sleeping better on weeknights, weekends harder"></textarea></div><button class="btn primary" data-act="save-reflect">Save reflection</button>`)},
  'save-reflect'(){const v=$('#ref').value.trim();if(!v){$('#ref').focus();return}S.reflections.push({text:v,date:new Date().toLocaleDateString('en-AU',{weekday:'short',day:'numeric',month:'short'})});save();closeSheet();render();toast('Reflection saved')},
  doc(id){const gp=id==='gp';openSheet(gp?'GP summary':'Prevent results report',`<div class="doc-preview"><h4>${gp?'Summary for '+esc(S.gp.split(',')[0]):'Prevent Plus results report'}</h4><p>${esc(S.name)} · DOB 14 Mar 1986 · Reviewed 18 Jul by Dr Priya Shah</p><p>${gp?'Preventive health assessment. Lipids and inflammation within range. HbA1c 5.7% and ALT 38 U/L, mildly raised; lifestyle plan agreed with recheck in 3 months. Sleep score 58/100. No medication changes recommended.':'12 markers across 5 areas. 9 in range, 2 to monitor, 1 action. Includes clinician interpretation, the agreed 90-day plan and recheck timing.'}</p></div>
    ${gp?`<button class="btn primary" data-act="share-gp">${S.planDone.gp?'Send again to your GP':'Send to your GP'}</button>`:''}<button class="btn" data-act="download">Download PDF</button>`)},
  'share-gp'(){S.planDone.gp=true;save();closeSheet();render();toast('GP summary sent to '+S.gp.split(',')[0])},
  download(){toast('Downloads aren’t connected in the prototype')},
  'upload-view'(id){const u=S.uploads.find(x=>x.id===id);openSheet(u.name,`<div class="card"><h3>Waiting for clinician review</h3><p>Your clinician will check this file before your next appointment. Until then it isn’t used in your results.</p></div><button class="btn danger" data-act="remove-upload" data-id="${id}">Remove file</button>`)},
  'remove-upload'(id){S.uploads=S.uploads.filter(u=>u.id!==id);save();closeSheet();render();toast('File removed')},
  'mhr-tab'(id){S.mhrTab=id;S.mhrFilter='All';save();render()},
  'mhr-filter'(id){S.mhrFilter=id;save();render()},
  'mhr-doc'(id){openSheet('Clinical document',`<div class="doc-preview"><h4>${esc(id)}</h4><p>From My Health Record. In production this opens the document as the source organisation uploaded it.</p></div>`)},
  'mhr-disconnect'(){openSheet('Disconnect My Health Record?',`<p class="h-sub" style="margin:0">Prevent clinicians would no longer see documents from your national record. You can reconnect any time.</p><button class="btn danger" data-act="close-sheet">Disconnect (prototype)</button><button class="btn" data-act="close-sheet">Keep connected</button>`)},
  'edit-profile'(){openSheet('Personal details',`<div class="field"><label for="pn">Full name</label><input id="pn" value="${esc(S.name)}"></div><div class="field"><label for="pe">Email</label><input id="pe" type="email" value="${esc(S.email)}"></div><div class="field"><label for="pg">Regular GP</label><input id="pg" value="${esc(S.gp)}"></div><button class="btn primary" data-act="save-profile">Save changes</button>`)},
  'save-profile'(){S.name=$('#pn').value.trim()||S.name;S.email=$('#pe').value.trim();S.gp=$('#pg').value.trim()||S.gp;save();closeSheet();render();toast('Changes saved')},
  sharing(){openSheet('Sharing and privacy',`<div class="card">${[['gp','Share reviewed summaries with my GP','Sent only after clinician review'],['research','Include de-identified data in service research','Never identifies you']].map(([k,t,s])=>`<div class="row" style="grid-template-columns:1fr auto"><span><strong>${t}</strong><small>${s}</small></span><button class="toggle" aria-pressed="${S.sharing[k]}" aria-label="${t}" data-act="share-toggle" data-id="${k}"></button></div>`).join('')}</div><div class="card"><h3>Your employer can’t see your results</h3><p>If your employer funds Prevent, they only see de-identified group reports above a minimum group size.</p></div>`)},
  'share-toggle'(k){S.sharing[k]=!S.sharing[k];save();const b=$(`#sheetContent [data-id="${k}"]`);b.setAttribute('aria-pressed',S.sharing[k]);render()},
  notifications(){openSheet('Notifications',`<div class="card">${[['appts','Appointment reminders','24 hours and 1 hour before'],['results','Results released','When your clinician releases a result'],['plan','Plan nudges','A weekly reminder for your actions']].map(([k,t,s])=>`<div class="row" style="grid-template-columns:1fr auto"><span><strong>${t}</strong><small>${s}</small></span><button class="toggle" aria-pressed="${S.notif[k]}" aria-label="${t}" data-act="notif-toggle" data-id="${k}"></button></div>`).join('')}</div>`)},
  'notif-toggle'(k){S.notif[k]=!S.notif[k];save();$(`#sheetContent [data-id="${k}"]`).setAttribute('aria-pressed',S.notif[k]);render()},
  device(id){S.devices[id]=!S.devices[id];save();render();toast(S.devices[id]?'Connected':'Disconnected')},
  sync(){const b=document.querySelector('[data-act="sync"]');b.disabled=true;b.innerHTML='<span class="spinner"></span> Syncing';setTimeout(()=>{S.synced='Just now';save();if(cur()==='devices')render();toast('Sync complete')},1300)},
  range(id){S.range=id;save();render()},
  theme(){const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem(KEY+'-theme',r.dataset.theme)}catch(e){}},
  'reset-demo'(){S=defaults();save();stack=['home'];closeSheet();render(true);toast('Demo data reset')}
};

/* ---------- Events ---------- */
document.addEventListener('click',e=>{
  const r=e.target.closest('[data-root]');if(r&&r.dataset.root){nav(r.dataset.root,{root:true});return}
  const g=e.target.closest('[data-go]');if(g){nav(g.dataset.go);return}
  const t=e.target.closest('[data-tab]');if(t){nav(t.dataset.tab,{root:true});return}
  const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act]){e.preventDefault();A[a.dataset.act](a.dataset.id);return}
});
$('#backBtn').addEventListener('click',()=>{if(stack.length>1){stack.pop();closeSheet();render(true)}});
$('#scrim').addEventListener('click',()=>closeSheet());
document.addEventListener('keydown',e=>{
  const sheet=$('#sheet');
  if(!sheet.classList.contains('open'))return;
  if(e.key==='Escape'){e.preventDefault();closeSheet();return}
  if(e.key!=='Tab')return;
  const focusable=[...sheet.querySelectorAll('button,input,textarea,select,a[href],[tabindex]')].filter(el=>!el.disabled&&el.tabIndex>=0&&el.getClientRects().length);
  const first=focusable[0],last=focusable[focusable.length-1];
  if(!first){e.preventDefault();sheet.focus();return}
  if(e.shiftKey&&(document.activeElement===first||document.activeElement===sheet)){e.preventDefault();last.focus()}
  else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===sheet)){e.preventDefault();first.focus()}
});

try{const th=localStorage.getItem(KEY+'-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
const start=(location.hash||'').slice(1);
if(DEF[start])stack=start==='home'?['home']:['home',start];
render(true);
})();
</script>
